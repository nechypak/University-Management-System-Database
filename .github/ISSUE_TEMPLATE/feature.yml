name: Database feature
description: Propose a schema or SQL improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What question or data problem should this solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe expected results and important edge cases.
    validations:
      required: true
  - type: textarea
    id: sql
    attributes:
      label: SQL concepts to practice
