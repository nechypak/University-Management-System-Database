services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: university
      POSTGRES_PASSWORD: university_local
      POSTGRES_DB: university_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - university_data:/var/lib/postgresql/data
      - .:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university -d university_db"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  university_data:
